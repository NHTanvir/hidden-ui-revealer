<!doctype html>
<html><head><meta charset="utf-8"><title>Hidden UI Revealer</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 13px system-ui, sans-serif; margin: 0; }
  header { padding: 8px 10px; border-bottom: 1px solid #8884; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 14px; margin: 0 auto 0 0; }
  button { font: inherit; padding: 3px 8px; cursor: pointer; }
  .row { padding: 6px 10px; border-bottom: 1px solid #8882; }
  .top { display: flex; gap: 8px; align-items: center; }
  .tag { font-family: monospace; color: #888; }
  .lbl { font-weight: 600; }
  .reasons { font-size: 11px; color: #a66; }
  .danger { color: #d33; font-weight: 700; }
  .url { font-size: 11px; color: #0a66c0; word-break: break-all; }
  #empty { padding: 20px; color: #888; }
</style></head>
<body>
<header><h1>Hidden UI Revealer</h1><button id="rescan">Rescan</button><button id="copy">Copy MD</button></header>
<div id="list"></div>
<div id="empty">Nothing hidden/disabled found on this tab. Add the host to scope and reload.</div>
<script type="module" src="panel.js"></script>
</body></html>
